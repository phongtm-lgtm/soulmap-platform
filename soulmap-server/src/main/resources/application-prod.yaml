spring:
  datasource:
    url: ${SOULMAP_DATABASE_URL}
    username: ${SOULMAP_DATABASE_USERNAME}
    password: ${SOULMAP_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SOULMAP_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${SOULMAP_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${SOULMAP_DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${SOULMAP_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${SOULMAP_DB_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SOULMAP_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${SOULMAP_SWAGGER_UI_ENABLED:false}

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO