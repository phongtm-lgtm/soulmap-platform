server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: soulmap-server

  profiles:
    default: dev

  jpa:
    open-in-view: false

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"
  level:
    root: ${SOULMAP_LOG_LEVEL:INFO}
    com.soulmap.server: ${SOULMAP_APP_LOG_LEVEL:INFO}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

soulmap:
  ai:
    provider: ${SOULMAP_AI_PROVIDER:9router}
    base-url: ${SOULMAP_AI_BASE_URL:https://api.9router.com/v1}
    api-key: ${SOULMAP_AI_API_KEY:}
    model: ${SOULMAP_AI_MODEL:cx/gpt-5.6-luna}
    timeout-seconds: ${SOULMAP_AI_TIMEOUT_SECONDS:300}
    temperature: ${SOULMAP_AI_TEMPERATURE:0.4}
    structured-output-mode: ${SOULMAP_AI_STRUCTURED_OUTPUT_MODE:json_object}
    career-prompt-pack: ${SOULMAP_AI_CAREER_PROMPT_PACK:core}
    prompts:
      base-path: ${SOULMAP_PROMPT_BASE_PATH:classpath:prompts}
