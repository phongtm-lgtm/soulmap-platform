spring:
  datasource:
    url: ${SOULMAP_DATABASE_URL:jdbc:postgresql://postgres:5432/soulmap?options=-c%20timezone%3DAsia/Ho_Chi_Minh}
    username: ${SOULMAP_DATABASE_USERNAME}
    password: ${SOULMAP_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
