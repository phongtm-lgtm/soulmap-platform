spring:
  datasource:
    url: ${SOULMAP_DATABASE_URL}
    username: ${SOULMAP_DATABASE_USERNAME}
    password: ${SOULMAP_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
